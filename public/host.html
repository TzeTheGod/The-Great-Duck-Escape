<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Great Duck Escape — Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root {
    --cream: #FFFBF0; --grass: #7BC67E; --water: #64B5F6; --lane: #E8D5B0;
    --accent: #FFD93D; --dark: #2D2D2D; --red: #E53935;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Nunito', system-ui, sans-serif; color: var(--dark);
    background: linear-gradient(180deg, #FFFBF0 0%, #FFF3D6 45%, #BFE6FF 100%);
  }
  h1,h2,h3,.display { font-family: 'Fredoka One', cursive; font-weight: 400; }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  /* ---- top bar ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; background: rgba(255,255,255,.7); backdrop-filter: blur(6px);
    border-bottom: 4px solid var(--accent);
  }
  .title { font-size: 38px; }
  .title span { color: #E0A800; }
  .roominfo { display: flex; align-items: center; gap: 22px; }
  .roomcode { font-size: 30px; }
  .roomcode b { font-size: 42px; color: var(--red); letter-spacing: 3px; }
  #qr { background: #fff; padding: 8px; border-radius: 12px; line-height: 0; box-shadow: 0 4px 12px rgba(0,0,0,.12); }

  /* ---- lobby pond ---- */
  .pond {
    flex: 1; position: relative; margin: 22px; border-radius: 30px;
    background: radial-gradient(ellipse at 50% 120%, #9fdcff, var(--water));
    box-shadow: inset 0 8px 30px rgba(0,40,80,.18); overflow: hidden;
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    gap: 6px 14px; padding: 30px;
  }
  .pond::after {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, transparent 0 38px, rgba(255,255,255,.07) 38px 40px);
    pointer-events: none;
  }
  .pondd004 { /* spacer */ }
  .pond-duck { display: flex; flex-direction: column; align-items: center; width: 90px; }
  .pond-duck .name {
    font-weight: 800; font-size: 15px; margin-top: -6px; background: rgba(255,255,255,.85);
    padding: 1px 8px; border-radius: 999px; max-width: 88px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .bob { animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }

  .lobby-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px 24px; gap: 20px;
  }
  .count-banner { font-size: 44px; }
  .count-banner b { color: var(--red); }
  .btn {
    font-family: 'Fredoka One'; font-size: 30px; color: var(--dark);
    background: var(--accent); border: none; border-radius: 20px; padding: 18px 38px;
    cursor: pointer; box-shadow: 0 8px 0 #d9a400; transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #d9a400; }
  .btn[disabled] { opacity: .45; cursor: default; box-shadow: none; }
  .btn.ghost { background: #fff; box-shadow: 0 6px 0 #d8cba6; font-size: 22px; padding: 12px 24px; }
  .btn.danger { background: #ffe0df; box-shadow: 0 6px 0 #e0a4a2; color: var(--red); }
  .join-hint { font-weight: 800; color: #6b5e3f; font-size: 20px; }
  .join-hint b { color: var(--dark); }

  /* ---- countdown ---- */
  #screen-countdown { align-items: center; justify-content: center; background: rgba(255,251,240,.96); }
  .count-num { font-size: 260px; color: var(--red); }
  @keyframes pop { 0% { transform: scale(.4); opacity:0; } 50% { transform: scale(1.15); opacity:1; } 100% { transform: scale(1);} }

  /* ---- race ---- */
  #screen-race { align-items: stretch; }
  .race-head { display:flex; align-items:center; justify-content:space-between; padding: 16px 30px; }
  .race-head .big { font-size: 40px; }
  .track {
    flex: 1; position: relative; margin: 0 26px 22px; border-radius: 24px; overflow: hidden;
    background:
      linear-gradient(180deg, #cde0ff 0%, #eafff0 100%);
  }
  .finish {
    position: absolute; top: 0; left: 0; right: 0; height: 30px;
    background: repeating-linear-gradient(90deg, #2d2d2d 0 18px, #fff 18px 36px);
    z-index: 5;
  }
  .finish-label { position:absolute; top: 32px; right: 14px; font-weight: 800; color:#2d2d2d; z-index:5; }
  .start-line { position:absolute; bottom: 0; left:0; right:0; height: 10px; background: var(--grass); }
  .racer { position: absolute; bottom: 0; transition: filter .6s; will-change: transform; }
  .racer .name { font-weight: 800; font-size: 13px; text-align:center; background: rgba(255,255,255,.85); border-radius: 999px; padding: 0 6px; margin-top: -4px; white-space: nowrap; }
  .racer.dim { filter: grayscale(.8) opacity(.25); }
  .racer.spotlight { z-index: 20; }

  .bubble {
    position: absolute; z-index: 10; background: #fff; border-radius: 16px; padding: 6px 14px;
    font-weight: 800; font-size: 18px; box-shadow: 0 6px 16px rgba(0,0,0,.15);
    pointer-events: none; white-space: nowrap; animation: floatUp 2.6s ease-out forwards;
  }
  @keyframes floatUp { 0% { opacity:0; transform: translateY(10px) scale(.8);} 15%{opacity:1;transform:translateY(0) scale(1);} 100%{opacity:0; transform: translateY(-70px);} }
  .ambient {
    position: absolute; z-index: 8; background: rgba(45,45,45,.85); color:#fff; border-radius: 999px;
    padding: 8px 18px; font-weight: 800; font-size: 18px; pointer-events: none; white-space: nowrap;
    animation: drift 9s linear forwards;
  }
  @keyframes drift { 0%{opacity:0; transform: translateX(0);} 10%{opacity:1;} 90%{opacity:1;} 100%{opacity:0; transform: translateX(-40px);} }

  .spotmask {
    position:absolute; inset:0; z-index:15; pointer-events:none; opacity:0; transition: opacity 1s;
    background: radial-gradient(circle at 50% 75%, rgba(0,0,0,0) 14%, rgba(0,0,0,.72) 48%);
  }
  .spotmask.on { opacity: 1; }

  /* ---- banners / reveal ---- */
  .center-overlay {
    position:absolute; inset:0; z-index: 30; display:none; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding: 30px; gap: 22px;
  }
  .center-overlay.active { display:flex; }
  .banner-text { font-size: 56px; max-width: 1100px; line-height: 1.15; }
  .reveal-line { font-size: 60px; color: var(--dark); opacity: 0; transform: translateY(20px); transition: all .7s; }
  .reveal-line.show { opacity:1; transform: translateY(0); }
  .reveal-line.red { color: var(--red); }
  #revealStage { background: rgba(20,10,10,.0); transition: background 1s; }
  #revealStage.dark { background: rgba(20,12,8,.9); }
  #revealStage.dark .reveal-line { color: #fff; }
  #revealStage.dark .reveal-line.red { color: #ff6b67; }

  .hero-wrap { display:none; gap: 60px; align-items:flex-end; justify-content:center; flex-wrap: wrap; }
  .hero-wrap.active { display:flex; }
  .hero {
    display:flex; flex-direction:column; align-items:center; gap: 10px;
    background: rgba(255,255,255,.95); border-radius: 28px; padding: 26px 30px;
    box-shadow: 0 16px 50px rgba(0,0,0,.3); animation: rise .8s ease-out;
  }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .crown { font-size: 60px; margin-bottom: -16px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.2)); }
  .hero .hname { font-size: 40px; }
  .hero .htitle { font-weight: 800; font-size: 24px; background: var(--accent); padding: 6px 18px; border-radius: 999px; }
  .hero .htaps { font-weight: 800; color: #6b5e3f; font-size: 20px; }
  .reveal-controls { position:absolute; bottom: 24px; right: 28px; z-index: 40; display:flex; gap: 14px; }

  .host-controls { position: absolute; bottom: 18px; left: 28px; z-index: 40; display:flex; gap: 14px; }

  /* ---- leaderboard ---- */
  .leaderboard {
    display: none; flex-direction: column; gap: 6px; width: 100%; max-width: 900px;
    max-height: 260px; overflow-y: auto; margin-top: 10px;
  }
  .leaderboard.active { display: flex; }
  .lb-row {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.88); border-radius: 14px; padding: 8px 16px;
    animation: rise .5s ease-out both;
  }
  .lb-row.lb-winner { background: rgba(255,217,61,.92); border: 3px solid #d9a400; }
  .lb-rank { font-family: 'Fredoka One'; font-size: 26px; width: 42px; text-align: center; flex-shrink: 0; }
  .lb-rank.gold   { color: #B8860B; }
  .lb-rank.silver { color: #888; }
  .lb-rank.bronze { color: #a05a2c; }
  .lb-name { font-weight: 800; font-size: 22px; flex: 1; text-align: left; }
  .lb-taps { font-weight: 800; font-size: 20px; color: #6b5e3f; flex-shrink: 0; }
  .lb-badge { font-size: 18px; font-weight: 800; background: var(--red); color: #fff; border-radius: 999px; padding: 2px 12px; flex-shrink: 0; }
</style>
</head>
<body>

  <!-- ===================== LOBBY ===================== -->
  <section id="screen-lobby" class="screen active">
    <div class="topbar">
      <div class="title display">🦆 THE GREAT <span>DUCK ESCAPE</span></div>
      <div class="roominfo">
        <div class="roomcode">Room <b id="roomCode">····</b></div>
        <div id="qr"></div>
      </div>
    </div>
    <div class="pond" id="pond"></div>
    <div class="lobby-footer">
      <div>
        <div class="count-banner display"><b id="duckCount">0</b> Ducks in the Pond 🦆</div>
        <div class="join-hint">Join at <b id="joinUrl">…</b></div>
      </div>
      <button class="btn" id="startBtn" disabled>Start Game</button>
    </div>
  </section>

  <!-- ===================== COUNTDOWN ===================== -->
  <section id="screen-countdown" class="screen">
    <div class="count-num display" id="hostCount">3</div>
  </section>

  <!-- ===================== SUBMITTING / RACE PREP ===================== -->
  <section id="screen-collect" class="screen" style="align-items:center;justify-content:center;gap:30px;">
    <div class="display" style="font-size:64px;">Race in progress… 🦆</div>
    <div class="display" style="font-size:46px;color:var(--red);"><span id="subCount">0</span> / <span id="subTotal">0</span> ducks submitted</div>
    <div style="height:18px;width:60%;max-width:700px;background:#eadcb8;border-radius:12px;overflow:hidden;">
      <div id="subBar" style="height:100%;width:0;background:linear-gradient(90deg,var(--grass),#4fae64);transition:width .4s;"></div>
    </div>
    <button class="btn" id="raceBtn" style="display:none;">All Scores In — Start Race</button>
    <div class="join-hint" id="collectHint">Counting every last quack…</div>
  </section>

  <!-- ===================== RACE ===================== -->
  <section id="screen-race" class="screen">
    <div class="race-head">
      <div class="big display">🦆 And they're off! Escape the responsibility!</div>
    </div>
    <div class="track" id="track">
      <div class="finish"></div>
      <div class="finish-label">🏁 FREEDOM</div>
      <div class="start-line"></div>
      <div class="spotmask" id="spotmask"></div>

      <!-- center overlay used for both celebration banner and the twist reveal -->
      <div class="center-overlay" id="revealStage">
        <div id="bannerText" class="banner-text display"></div>
        <div id="revealLines"></div>
        <div class="hero-wrap" id="heroWrap"></div>
        <div class="leaderboard" id="leaderboard"></div>
      </div>
    </div>

    <div class="host-controls" id="raceControls" style="display:none;">
      <button class="btn ghost" id="revealBtn">Trigger Reveal ✨</button>
    </div>
    <div class="reveal-controls">
      <button class="btn danger" id="resetBtn" style="display:none;">Reset Game</button>
    </div>
  </section>

<script>
// ---------- shared duck helpers (kept in sync with index.html) ----------
const COLORS = ['#FFD700', '#4FC3F7', '#F48FB1', '#CE93D8', '#81C784', '#FFB74D'];
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(Math.min(255, Math.max(0, r * (1 + pct))));
  g = Math.round(Math.min(255, Math.max(0, g * (1 + pct))));
  b = Math.round(Math.min(255, Math.max(0, b * (1 + pct))));
  return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
}
function duckSVG(color, size, expression) {
  expression = expression || 'normal';
  const dark = shade(color, -0.22), light = shade(color, 0.32);
  let eyes;
  if (expression === 'squished') {
    eyes = `<path d="M34 31 q6 4 12 0" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M54 31 q6 4 12 0" stroke="#2D2D2D" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  } else if (expression === 'happy') {
    eyes = `<path d="M34 33 q6 -7 12 0" stroke="#2D2D2D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M54 33 q6 -7 12 0" stroke="#2D2D2D" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <circle cx="30" cy="44" r="4.5" fill="#F48FB1" opacity=".55"/>
            <circle cx="70" cy="44" r="4.5" fill="#F48FB1" opacity=".55"/>`;
  } else {
    eyes = `<circle cx="40" cy="32" r="6.5" fill="#fff"/><circle cx="60" cy="32" r="6.5" fill="#fff"/>
            <circle cx="41" cy="33" r="3.4" fill="#2D2D2D"/><circle cx="61" cy="33" r="3.4" fill="#2D2D2D"/>
            <circle cx="39.4" cy="30.6" r="1.4" fill="#fff"/><circle cx="59.4" cy="30.6" r="1.4" fill="#fff"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="50" cy="90" rx="30" ry="6" fill="#000" opacity=".08"/>
    <ellipse cx="20" cy="64" rx="9" ry="17" fill="${dark}"/>
    <ellipse cx="80" cy="64" rx="9" ry="17" fill="${dark}"/>
    <ellipse cx="50" cy="68" rx="34" ry="30" fill="${color}"/>
    <ellipse cx="50" cy="76" rx="22" ry="16" fill="${light}"/>
    <circle cx="50" cy="37" r="24" fill="${color}"/>
    <ellipse cx="50" cy="46" rx="12" ry="6.5" fill="#FF9800"/>
    <path d="M40 46 q10 6 20 0" stroke="#E07B00" stroke-width="1.6" fill="none"/>
    ${eyes}
  </svg>`;
}

function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ---------- state ----------
let roomCode = '····';
const ducks = new Map(); // id -> {id,name,color}
let scores = [];         // populated when race starts
let raceRAF = null;
let bubbleTimers = [];

// ---------- lobby ----------
function setRoom(code) {
  roomCode = code;
  document.getElementById('roomCode').textContent = code;
  const url = `${location.origin}/?room=${code}`;
  document.getElementById('joinUrl').textContent = url.replace(/^https?:\/\//, '');
  const qr = document.getElementById('qr');
  qr.innerHTML = '';
  const canvas = document.createElement('canvas');
  qr.appendChild(canvas);
  if (window.QRCode) {
    QRCode.toCanvas(canvas, url, { width: 120, margin: 1, color: { dark: '#2D2D2D', light: '#ffffff' } }, () => {});
  }
}

function renderPond() {
  const pond = document.getElementById('pond');
  pond.innerHTML = '';
  for (const d of ducks.values()) {
    const wrap = document.createElement('div');
    wrap.className = 'pond-duck';
    const inner = document.createElement('div');
    inner.className = 'bob';
    inner.style.animationDelay = (Math.random() * 1.8).toFixed(2) + 's';
    inner.innerHTML = duckSVG(d.color, 66, 'normal');
    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = d.name;
    wrap.appendChild(inner);
    wrap.appendChild(name);
    pond.appendChild(wrap);
  }
  document.getElementById('duckCount').textContent = ducks.size;
  document.getElementById('startBtn').disabled = ducks.size === 0;
}

function addDuck(d) {
  ducks.set(d.id, { id: d.id, name: d.name, color: d.color });
  renderPond();
}

// ---------- countdown ----------
function runCountdown() {
  show('screen-countdown');
  const seq = ['3', '2', '1', 'QUACK! 🦆'];
  let i = 0;
  const el = document.getElementById('hostCount');
  const tick = () => {
    el.textContent = seq[i];
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = 'pop .9s ease-out';
    beep(i < 3 ? 520 + i * 80 : 760, i < 3 ? 0.12 : 0.4);
    i++;
    if (i < seq.length) setTimeout(tick, 1000);
  };
  tick();
}

// ---------- collect / submitting ----------
function showCollect() {
  show('screen-collect');
  document.getElementById('raceBtn').style.display = 'inline-block';
  updateSubmissions(currentSub.submitted, currentSub.total);
}
const currentSub = { submitted: 0, total: 0 };
function updateSubmissions(submitted, total) {
  currentSub.submitted = submitted; currentSub.total = total;
  document.getElementById('subCount').textContent = submitted;
  document.getElementById('subTotal').textContent = total;
  const pct = total ? (submitted / total) * 100 : 0;
  document.getElementById('subBar').style.width = pct + '%';
  if (total && submitted >= total) document.getElementById('collectHint').textContent = 'All ducks accounted for! 🦆';
}

// ===================== RACE =====================
const FUN_EVENTS = ['Found Bread 🍞', 'Distracted by Butterfly 🦋', 'Quick Power Nap 😴', 'Coffee Boost ☕', 'Snack break 🥨', 'Splash! 💦'];
const AMBIENT = [
  'Client requested one small change', 'Awaiting approval', 'Partner has comments',
  'Meeting extended by 30 minutes', 'Deck formatting issue detected', 'Scope increased',
  '"Quick" sync scheduled', 'Circling back on this',
];

function startRace() {
  show('screen-race');
  document.getElementById('raceControls').style.display = 'none';
  document.getElementById('resetBtn').style.display = 'none';
  const track = document.getElementById('track');
  // clear previous racers
  track.querySelectorAll('.racer, .bubble, .ambient').forEach((n) => n.remove());
  document.getElementById('revealStage').classList.remove('active', 'dark');
  document.getElementById('spotmask').classList.remove('on');

  const n = scores.length;
  if (n === 0) return;
  const tapVals = scores.map((s) => s.tapCount);
  const maxT = Math.max(...tapVals, 1);
  const minT = Math.min(...tapVals);
  const range = Math.max(1, maxT - minT);

  // Build racers. finishTime: most taps => 7s (fast), fewest => 10s (agonising waddle).
  const racers = scores.map((s, i) => {
    const norm = (s.tapCount - minT) / range; // 1 = fastest
    const finishTime = 7000 + (1 - norm) * 3000;
    const el = document.createElement('div');
    el.className = 'racer';
    const left = n === 1 ? 50 : 6 + (i / (n - 1)) * 88;
    el.style.left = left + '%';
    el.style.transform = 'translateX(-50%)';
    el.innerHTML = `<div class="duckbody">${duckSVG(s.color, 46, 'happy')}</div><div class="name">${escapeHtml(s.name)}</div>`;
    track.appendChild(el);
    return { ...s, el, finishTime, wobbleSeed: Math.random() * 6.28, body: el.querySelector('.duckbody') };
  });

  const maxFinish = Math.max(...racers.map((r) => r.finishTime));
  const trackH = track.clientHeight;
  const travel = trackH - 90; // leave room for finish + duck

  const start = performance.now();
  scheduleBubbles(racers, maxFinish);

  function frame(now) {
    const elapsed = now - start;
    racers.forEach((r) => {
      const p = Math.min(1, elapsed / r.finishTime);
      const eased = p; // linear keeps ordering honest
      const y = eased * travel;
      const wobbleX = Math.sin(elapsed / 180 + r.wobbleSeed) * 5;
      r.el.style.bottom = y + 'px';
      r.el.style.transform = `translateX(calc(-50% + ${wobbleX}px))`;
      // squash & stretch on the body only
      const sq = 1 + Math.sin(elapsed / 90 + r.wobbleSeed) * 0.08 * (p < 1 ? 1 : 0);
      if (r.body) r.body.style.transform = `scale(${2 - sq}, ${sq})`;
    });
    if (elapsed < maxFinish) {
      raceRAF = requestAnimationFrame(frame);
    } else {
      onRaceComplete(racers);
    }
  }
  raceRAF = requestAnimationFrame(frame);
}

function scheduleBubbles(racers, totalMs) {
  clearBubbles();
  const track = document.getElementById('track');
  // fun event bubbles near random ducks
  for (let t = 800; t < totalMs - 600; t += 700 + Math.random() * 600) {
    const id = setTimeout(() => {
      const r = racers[Math.floor(Math.random() * racers.length)];
      if (!r) return;
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = FUN_EVENTS[Math.floor(Math.random() * FUN_EVENTS.length)];
      const rect = r.el.getBoundingClientRect();
      const trect = track.getBoundingClientRect();
      b.style.left = (rect.left - trect.left) + 'px';
      b.style.bottom = (trect.bottom - rect.top + 6) + 'px';
      track.appendChild(b);
      setTimeout(() => b.remove(), 2700);
    }, t);
    bubbleTimers.push(id);
  }
  // ambient consulting flavour drifting across
  for (let t = 1200; t < totalMs; t += 1500 + Math.random() * 900) {
    const id = setTimeout(() => {
      const a = document.createElement('div');
      a.className = 'ambient';
      a.textContent = AMBIENT[Math.floor(Math.random() * AMBIENT.length)];
      a.style.right = '8%';
      a.style.bottom = (15 + Math.random() * 70) + '%';
      track.appendChild(a);
      setTimeout(() => a.remove(), 9200);
    }, t);
    bubbleTimers.push(id);
  }
}
function clearBubbles() { bubbleTimers.forEach(clearTimeout); bubbleTimers = []; }

function onRaceComplete(racers) {
  clearBubbles();
  // Step 1 — celebrate the fast escapees
  const stage = document.getElementById('revealStage');
  const banner = document.getElementById('bannerText');
  banner.innerHTML = 'The fastest ducks have successfully<br>escaped responsibility. 🦆💨';
  document.getElementById('revealLines').innerHTML = '';
  document.getElementById('heroWrap').classList.remove('active');
  document.getElementById('heroWrap').innerHTML = '';
  stage.classList.add('active');
  confettiBurst(0.5);
  // show the Trigger Reveal control so the host paces the twist
  document.getElementById('raceControls').style.display = 'flex';
}

// ===================== REVEAL =====================
function triggerReveal() {
  document.getElementById('raceControls').style.display = 'none';
  // bottom 2 = two FEWEST taps (the "winners")
  const sorted = [...scores].sort((a, b) => a.tapCount - b.tapCount);
  const losers = sorted.slice(0, Math.min(2, sorted.length));
  const loserIds = new Set(losers.map((l) => l.id));

  const stage = document.getElementById('revealStage');
  const banner = document.getElementById('bannerText');
  const linesBox = document.getElementById('revealLines');
  banner.innerHTML = '';
  linesBox.innerHTML = '';

  // Step 2 — spotlight the last 2 ducks
  document.querySelectorAll('.racer').forEach((el, i) => {
    const id = scores[i] && scores[i].id;
    if (loserIds.has(id)) { el.classList.add('spotlight'); el.classList.remove('dim'); }
    else { el.classList.add('dim'); }
  });
  document.getElementById('spotmask').classList.add('on');
  beep(180, 0.8); // ominous sting

  const lines = [
    { t: 'Congratulations.', red: false, d: 1800 },
    { t: 'Your leadership potential has been identified.', red: false, d: 2600 },
    { t: 'You are the new Townhall Organizers.', red: true, d: 2600 },
  ];

  let delay = 1400;
  stage.classList.add('active');
  setTimeout(() => stage.classList.add('dark'), 600);
  lines.forEach((ln) => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'reveal-line display' + (ln.red ? ' red' : '');
      div.textContent = ln.t;
      linesBox.appendChild(div);
      void div.offsetWidth;
      div.classList.add('show');
      beep(ln.red ? 300 : 440, 0.25);
    }, delay);
    delay += ln.d;
  });

  // Step 5 — hero reveal of the winners
  setTimeout(() => {
    linesBox.innerHTML = '';
    stage.classList.remove('dark');
    document.getElementById('spotmask').classList.remove('on');
    document.querySelectorAll('.racer').forEach((el) => { el.classList.remove('dim'); el.style.opacity = 0.15; });
    showHeroes(losers);
  }, delay + 600);
}

const TITLES = ['Chief Logistics Duck 🦆', 'Deputy Quack Officer 🦆', 'VP of Vibes 🦆', 'Head of Snacks 🦆'];
function showHeroes(losers) {
  const banner = document.getElementById('bannerText');
  banner.innerHTML = '👑 Your New Townhall Organizers 👑';
  const wrap = document.getElementById('heroWrap');
  wrap.innerHTML = '';
  losers.forEach((l, i) => {
    const h = document.createElement('div');
    h.className = 'hero';
    h.style.animationDelay = (i * 0.25) + 's';
    h.innerHTML = `
      <div class="crown">👑</div>
      <div>${duckSVG(l.color, 150, 'happy')}</div>
      <div class="hname display">${escapeHtml(l.name)}</div>
      <div class="htitle">${TITLES[i] || 'Townhall Organizer 🦆'}</div>
      <div class="htaps">${l.tapCount} taps — heroically slow</div>`;
    wrap.appendChild(h);
  });
  wrap.classList.add('active');
  confettiBurst(1);
  setTimeout(() => confettiBurst(1), 700);
  setTimeout(() => confettiBurst(1), 1500);
  document.getElementById('resetBtn').style.display = 'inline-block';

  // Full leaderboard — sorted fastest (most taps) to slowest
  const loserIds = new Set(losers.map((l) => l.id));
  const sorted = [...scores].sort((a, b) => b.tapCount - a.tapCount);
  const lb = document.getElementById('leaderboard');
  lb.innerHTML = '<div style="font-family:\'Fredoka One\';font-size:28px;text-align:center;margin-bottom:4px;">📊 Full Rankings</div>';
  const rankSymbols = ['🥇', '🥈', '🥉'];
  sorted.forEach((p, i) => {
    const isWinner = loserIds.has(p.id);
    const row = document.createElement('div');
    row.className = 'lb-row' + (isWinner ? ' lb-winner' : '');
    row.style.animationDelay = (i * 0.06) + 's';
    const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
    const rankDisplay = rankSymbols[i] || `#${i + 1}`;
    row.innerHTML = `
      <div class="lb-rank ${rankClass}">${rankDisplay}</div>
      <div style="flex-shrink:0">${duckSVG(p.color, 36, 'happy')}</div>
      <div class="lb-name">${escapeHtml(p.name)}</div>
      <div class="lb-taps">${p.tapCount} taps</div>
      ${isWinner ? '<div class="lb-badge">Organizer 👑</div>' : ''}`;
    lb.appendChild(row);
  });
  lb.classList.add('active');
}

// ---------- confetti ----------
function confettiBurst(intensity) {
  if (!window.confetti) return;
  const count = Math.round(120 * intensity);
  confetti({ particleCount: count, spread: 90, origin: { y: 0.6 }, colors: COLORS });
  confetti({ particleCount: Math.round(count / 2), angle: 60, spread: 60, origin: { x: 0 }, colors: COLORS });
  confetti({ particleCount: Math.round(count / 2), angle: 120, spread: 60, origin: { x: 1 }, colors: COLORS });
}

// ---------- audio ----------
let audioCtx = null;
function beep(freq, dur) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = freq; o.type = 'triangle';
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.16, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- host controls ----------
document.getElementById('startBtn').onclick = () => { send('start_countdown'); document.getElementById('startBtn').disabled = true; };
document.getElementById('raceBtn').onclick = () => send('start_race');
document.getElementById('revealBtn').onclick = () => send('trigger_reveal');
document.getElementById('resetBtn').onclick = () => { if (confirm('Reset the game and clear all ducks?')) send('reset'); };

// ---------- websocket ----------
let ws;
function send(action) { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'host_action', action })); }
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?role=host`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    switch (m.type) {
      case 'welcome':
        setRoom(m.roomCode);
        ducks.clear();
        (m.players || []).forEach(addDuck);
        renderPond();
        if (m.phase === 'lobby') show('screen-lobby');
        else if (m.phase === 'countdown') runCountdown();
        else if (m.phase === 'tapping' || m.phase === 'submitting') {
          updateSubmissions(m.submitted || 0, m.total || 0);
          if (m.phase === 'submitting') showCollect(); else show('screen-collect');
        }
        break;
      case 'player_joined':
        addDuck(m);
        break;
      case 'phase_change':
        if (m.phase === 'countdown') runCountdown();
        else if (m.phase === 'tapping') { updateSubmissions(0, ducks.size); show('screen-collect'); document.getElementById('raceBtn').style.display = 'none'; document.getElementById('collectHint').textContent = 'Counting every last quack…'; }
        else if (m.phase === 'submitting') showCollect();
        else if (m.phase === 'race') startRace();
        else if (m.phase === 'reveal') triggerReveal();
        else if (m.phase === 'lobby') { show('screen-lobby'); document.getElementById('startBtn').disabled = ducks.size === 0; }
        break;
      case 'submission_update':
        updateSubmissions(m.submitted, m.total);
        break;
      case 'scores':
        scores = m.players || [];
        break;
      case 'reset':
        cancelAnimationFrame(raceRAF); clearBubbles();
        setRoom(m.roomCode); ducks.clear(); renderPond();
        scores = [];
        show('screen-lobby');
        document.getElementById('startBtn').disabled = true;
        break;
    }
  };
  ws.onclose = () => setTimeout(connect, 1500);
}
connect();
</script>
